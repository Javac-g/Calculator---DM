name: Native Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-linux:
    name: Package Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Test and prepare jpackage input
        run: gradle clean test prepareJpackageInput --no-daemon
      - name: Build DEB package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAIN_JAR="$(basename "$(find build/jpackage-input -maxdepth 1 -name 'Calculator-DM-*.jar' -print -quit)")"
          mkdir -p build/release
          jpackage --type deb --name denysov-calculator --app-version "$VERSION" --vendor "Javac-g" --description "Modern scientific calculator built with Java 21 and JavaFX" --input build/jpackage-input --main-jar "$MAIN_JAR" --main-class com.denysov.calculator.CalculatorApplication --dest build/release --linux-package-name denysov-calculator --linux-menu-group Utility --linux-shortcut
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: build/release/*.deb
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - name: Test and prepare jpackage input
        run: gradle clean test prepareJpackageInput --no-daemon
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $jar = (Get-ChildItem -Path "build/jpackage-input" -Filter "Calculator-DM-*.jar" | Select-Object -First 1).Name
          New-Item -ItemType Directory -Force -Path "build/release" | Out-Null
          jpackage --type exe --name "Denysov Calculator" --app-version "$version" --vendor "Javac-g" --description "Modern scientific calculator built with Java 21 and JavaFX" --input "build/jpackage-input" --main-jar "$jar" --main-class "com.denysov.calculator.CalculatorApplication" --dest "build/release" --win-menu --win-shortcut --win-dir-chooser
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package-linux
      - package-windows

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
